[package]
name = "kb"
version = "0.1.0"
edition = "2024"
description = "Cross-platform CLI for managing the knowledge-base ecosystem"

[[bin]]
name = "kb"
path = "src/main.rs"

[dependencies]
kb-core = { path = "../kb-core" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
anyhow = "1"
colored = "2"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
